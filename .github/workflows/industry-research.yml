name: Industry research pilot
on:
  workflow_dispatch:
  push:
    paths:
      - "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/**"
      - ".github/workflows/industry-research.yml"
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: [maintenance, steel, semiconductor, power, gas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Requirements.txt"
      - name: Validate smoke pilot
        run: |
          python "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Industrial Federated Benchmark.py" --dataset "$BENCHMARK_DATASET" --clients 2 --rounds 1 --max-rows 500
        env:
          BENCHMARK_DATASET: ${{ matrix.dataset }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Industry Pilot ${{ matrix.dataset }}
          path: "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Results/*.json"
          if-no-files-found: warn
