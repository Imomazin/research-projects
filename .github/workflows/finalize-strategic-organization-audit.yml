name: Finalize Strategic Organization audit materials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-strategic-organization-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --quiet numpy==2.3.5 pandas==2.2.3 matplotlib
      - name: Generate revised empirical figures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import matplotlib.pyplot as plt
          from matplotlib.collections import LineCollection
          root=Path('Strategic Organization')
          out=root/'04 Analysis'/'Supplementary Checks'/'Outputs'
          primary=pd.read_csv(root/'01 Primary Data'/'Compiled Participants Data_v2.csv',dtype=str,keep_default_na=False)
          ready=pd.read_csv(root/'03 Data Integration'/'Strategic_Organization_Analysis_Ready.csv',dtype=str,keep_default_na=False)
          mapped=ready[ready['ISCO-08'].astype(str).str.strip()!=''].copy()
          conv=pd.to_numeric(mapped['Conventional Capability Index']).to_numpy()
          ai=pd.to_numeric(mapped['AI/Data Capability Index']).to_numpy()
          seg=[((0,c),(1,a)) for c,a in zip(conv,ai)]
          fig,ax=plt.subplots(figsize=(7.2,5.6))
          ax.add_collection(LineCollection(seg,linewidths=.7,alpha=.18))
          ax.scatter(np.zeros_like(conv),conv,s=8,alpha=.25)
          ax.scatter(np.ones_like(ai),ai,s=8,alpha=.25)
          ax.plot([0,1],[np.median(conv),np.median(ai)],marker='o',linewidth=2.5,label='Median profile')
          ax.set_xlim(-.18,1.18); ax.set_ylim(0,102)
          ax.set_xticks([0,1],['Conventional capability','AI/data capability'])
          ax.set_ylabel('Baseline score'); ax.legend(frameon=False); fig.tight_layout()
          fig.savefig(out/'figure_R1_paired_domain_profile.png',dpi=300,bbox_inches='tight'); plt.close(fig)
          ci=['Strategic Thinking Pre','Problem Solving Pre','Decision Making Pre','Leadership Pre','Adaptability Pre','Digital Capability Pre']
          ai_items=['AI Knowledge Pre','AI Application Pre','AI Judgement Pre','Data Literacy Pre']
          df=mapped.merge(primary[['Participant ID','Overall Baseline Score']+ci+ai_items],on='Participant ID',how='left',validate='one_to_one')
          overall=pd.to_numeric(df['Overall Baseline Score']).to_numpy()
          items=df[ci+ai_items].apply(pd.to_numeric).to_numpy()
          def mz(x):
              m=np.median(x); mad=np.median(np.abs(x-m)); return np.zeros_like(x) if mad==0 else .6745*(x-m)/mad
          keep=(overall>0)&(items>=10).all(axis=1)&(mz(conv)>=-3.5)&(mz(ai)>=-3.5)
          fig,ax=plt.subplots(figsize=(6.6,5.8))
          ax.scatter(conv[keep],ai[keep],s=24,alpha=.65,label='Retained by sensitivity screen')
          ax.scatter(conv[~keep],ai[~keep],s=42,marker='x',linewidths=1.2,label='Flagged by sensitivity screen')
          lim=[0,102]; ax.plot(lim,lim,linestyle='--',linewidth=1,label='Equal-score line')
          ax.set_xlim(lim); ax.set_ylim(lim); ax.set_xlabel('Conventional capability index'); ax.set_ylabel('AI/data capability index'); ax.legend(frameon=False); fig.tight_layout()
          fig.savefig(out/'figure_R2_capability_sorting_screened.png',dpi=300,bbox_inches='tight'); plt.close(fig)
          print('flagged',int((~keep).sum()))
          PY
      - name: Commit figures and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Strategic Organization/04 Analysis/Supplementary Checks/Outputs/figure_R1_paired_domain_profile.png'
          git add 'Strategic Organization/04 Analysis/Supplementary Checks/Outputs/figure_R2_capability_sorting_screened.png'
          git rm '.github/workflows/finalize-strategic-organization-audit.yml'
          git commit -m 'Add post-audit Strategic Organization figures'
          git push
