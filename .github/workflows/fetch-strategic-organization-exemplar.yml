name: Fetch Strategic Organization exemplar PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-strategic-organization-exemplar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-exemplar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render open-access Strategic Organization article to PDF
        shell: bash
        run: |
          set -euo pipefail
          OUT='Strategic Organization/05 Manuscript/Exemplar Paper/Figge_Anderson_Lewis_2026_AI-Human_Learning_Systems_reference.pdf'
          mkdir -p "$(dirname "$OUT")"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          urls=(
            'https://journals.sagepub.com/doi/full/10.1177/14761270251385860'
            'https://www.researchgate.net/publication/395945398_AI-human_learning_systems_Investigating_the_strategic_role_of_AI_for_organizational_learning'
          )
          ok=0
          for URL in "${urls[@]}"; do
            rm -f "$OUT"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=12000 --print-to-pdf="$OUT" "$URL" || true
            if [ -f "$OUT" ]; then
              python -m pip install --quiet pypdf
              if python - "$OUT" <<'PY'
          import sys
          from pathlib import Path
          from pypdf import PdfReader
          p=Path(sys.argv[1]); b=p.read_bytes()
          if not b.startswith(b'%PDF') or len(b) < 100000:
              raise SystemExit(1)
          text='\n'.join((page.extract_text() or '') for page in PdfReader(str(p))[:5])
          good='AI-human learning systems' in text and ('Strategic Organization' in text or 'organizational learning' in text)
          print(f'bytes={len(b):,} pages={len(PdfReader(str(p)))} title_valid={good}')
          raise SystemExit(0 if good else 1)
          PY
              then ok=1; break; fi
            fi
          done
          test "$ok" = 1
      - name: Commit exemplar and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Strategic Organization/05 Manuscript/Exemplar Paper/'
          git rm -f '.github/workflows/fetch-strategic-organization-exemplar.yml'
          git commit -m 'Add Strategic Organization exemplar reference PDF'
          git push
