name: Fetch Strategic Organization exemplar PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-strategic-organization-exemplar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-exemplar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch author-uploaded open-access exemplar
        shell: bash
        run: |
          set -euo pipefail
          OUT='Strategic Organization/05 Manuscript/Exemplar Paper/Faraj_Perez-Torrents_Mantere_Bhardwaj_2026_A_Time_for_Monsters.pdf'
          mkdir -p "$(dirname "$OUT")"
          urls=(
            'https://www.researchgate.net/profile/Anand-Bhardwaj-5/publication/397755478_A_time_for_monsters_Organizational_knowing_after_large_language_models/links/691ddb72ba4fcf00661a8589/A-time-for-monsters-Organizational-knowing-after-large-language-models.pdf'
            'https://www.researchgate.net/profile/Anand-Bhardwaj-5/publication/397755478_A_time_for_monsters_Organizational_knowing_after_large_language_models/links/691ddb72ba4fcf00661a8589/A-time-for-monsters-Organizational-knowing-after-large-language-models.pdf?origin=publication_detail'
          )
          ok=0
          for URL in "${urls[@]}"; do
            if curl -L --fail --retry 2 --retry-delay 2 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              -H 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8' \
              -H 'Referer: https://www.researchgate.net/publication/397755478_A_time_for_monsters_Organizational_knowing_after_large_language_models' \
              "$URL" -o "$OUT"; then
              if python - "$OUT" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); b=p.read_bytes()
          good=b.startswith(b'%PDF') and len(b)>100000
          print(f'bytes={len(b):,} valid_pdf={good}')
          raise SystemExit(0 if good else 1)
          PY
              then ok=1; break; fi
            fi
          done
          test "$ok" = 1
      - name: Commit exemplar and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Strategic Organization/05 Manuscript/Exemplar Paper/'
          git rm -f '.github/workflows/fetch-strategic-organization-exemplar.yml'
          git commit -m 'Add Strategic Organization exemplar PDF'
          git push
