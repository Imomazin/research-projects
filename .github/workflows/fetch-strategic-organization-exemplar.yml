name: Build Strategic Organization exemplar PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-strategic-organization-exemplar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exemplar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch accepted Strategic Organization manuscript and build reference PDF
        shell: bash
        run: |
          set -euo pipefail
          DIR='Strategic Organization/05 Manuscript/Exemplar Paper'
          mkdir -p "$DIR"
          RAW='https://raw.githubusercontent.com/linxule/interpretive-orchestration-paper/main/manuscript.md'
          LIC='https://raw.githubusercontent.com/linxule/interpretive-orchestration-paper/main/LICENSE'
          curl -L --fail "$RAW" -o "$DIR/Interpretive_Orchestration_accepted_manuscript.md"
          curl -L --fail "$LIC" -o "$DIR/Interpretive_Orchestration_CC-BY-4.0_LICENSE.txt"
          test "$(stat -c%s "$DIR/Interpretive_Orchestration_accepted_manuscript.md")" -gt 50000
          grep -qi 'Interpretive Orchestration' "$DIR/Interpretive_Orchestration_accepted_manuscript.md"
          grep -qi 'Strategic Organization' "$DIR/Interpretive_Orchestration_accepted_manuscript.md"
          python -m pip install --quiet markdown pypdf
          python - <<'PY'
          from pathlib import Path
          import markdown
          md = Path('Strategic Organization/05 Manuscript/Exemplar Paper/Interpretive_Orchestration_accepted_manuscript.md').read_text(encoding='utf-8')
          body = markdown.markdown(md, extensions=['tables','fenced_code'])
          css = '''
          @page { size: A4; margin: 20mm 18mm 22mm 18mm; }
          body { font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.55; color: #111; max-width: 760px; margin: 0 auto; }
          h1 { font-size: 20pt; margin-top: 0; }
          h2 { font-size: 15pt; margin-top: 24px; }
          h3 { font-size: 12pt; margin-top: 18px; }
          p { text-align: justify; margin: 0 0 9px 0; }
          blockquote { margin-left: 20px; color: #333; }
          table { border-collapse: collapse; width: 100%; font-size: 9pt; }
          th, td { border: 1px solid #aaa; padding: 5px; vertical-align: top; }
          a { color: #111; text-decoration: none; }
          '''
          html = f'<!doctype html><html><head><meta charset="utf-8"><style>{css}</style></head><body>{body}</body></html>'
          Path('/tmp/exemplar.html').write_text(html, encoding='utf-8')
          PY
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          OUT="$DIR/Lin_Corley_2026_Interpretive_Orchestration_Strategic_Organization_Accepted_Manuscript.pdf"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --print-to-pdf="$OUT" 'file:///tmp/exemplar.html'
          python - "$OUT" <<'PY'
          import sys
          from pathlib import Path
          from pypdf import PdfReader
          p=Path(sys.argv[1]); b=p.read_bytes(); r=PdfReader(str(p))
          text='\n'.join((page.extract_text() or '') for page in r.pages)
          good=(b.startswith(b'%PDF') and len(b)>100000 and len(r.pages)>=10 and
                'Interpretive Orchestration' in text and 'Strategic Organization' in text)
          print(f'Validated exemplar: bytes={len(b):,}, pages={len(r.pages)}, title_valid={good}')
          raise SystemExit(0 if good else 1)
          PY
      - name: Update exemplar metadata and commit
        shell: bash
        run: |
          set -euo pipefail
          DIR='Strategic Organization/05 Manuscript/Exemplar Paper'
          cat > "$DIR/Interpretive Orchestration - Strategic Organization.url" <<'EOF'
          [InternetShortcut]
          URL=https://doi.org/10.1177/14761270261448645
          EOF
          cat > "$DIR/README.md" <<'EOF'
          # Strategic Organization exemplar papers

          ## Stored full accepted manuscript

          Xule Lin and Kevin G. Corley (2026), **Interpretive Orchestration: An Essay Exploring the Epistemic Intersection of Human Intuition and Machine Intelligence**, *Strategic Organization*, advance online publication. DOI: 10.1177/14761270261448645.

          The authors maintain a public repository containing the complete accepted manuscript and a CC BY 4.0 licence. The PDF stored here was generated directly from that accepted manuscript. Use it as a journal-authentic benchmark for framing, theory positioning, conceptual development, contribution architecture, transitions and discussion style. Do not copy wording.

          ## Closest conceptual comparator for this project

          Patrick Figge, Edward Anderson and Kyle Lewis (2026), **AI-human learning systems: Investigating the strategic role of AI for organizational learning**, *Strategic Organization*, 24(2), 307–342. DOI: 10.1177/14761270251385860.

          The accompanying URL file and Writing Style Blueprint retain the Figge et al. paper as the closest conceptual comparator for the Strategic AI capability paper.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR"
          git rm -f '.github/workflows/fetch-strategic-organization-exemplar.yml'
          git commit -m 'Add full Strategic Organization accepted-manuscript exemplar PDF'
          git push
