name: Install Strategic Organization assets

on:
  push:
    branches: [main]
    paths:
      - '.transfer/source_chunks/**'
      - '.github/workflows/install-strategic-org-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify research sources
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/source_chunks/chunk_*.b64 > /tmp/text_bundle.b64
          echo 'eb62a02bf065a906773e7776511cd58fa1e54c7054b9644a63b4c059c486e8b2  /tmp/text_bundle.b64' | sha256sum -c -
          base64 -d /tmp/text_bundle.b64 > /tmp/sources.tar.gz
          echo 'e683310712f31c16cd4de65c5ab7f8ade245874ba27bd6a48008eb6f3c62a725  /tmp/sources.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sources.tar.gz -C .
          test -f 'Strategic Organization/01 Primary Data/Compiled Participants Data_v2.csv'
          test -f 'Strategic Organization/03 Data Integration/Strategic_Organization_Analysis_Ready.csv'

      - name: Build Excel research workbooks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas openpyxl
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from openpyxl import load_workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          root = Path('Strategic Organization')
          primary_csv = root/'01 Primary Data'/'Compiled Participants Data_v2.csv'
          career_csv = root/'03 Data Integration'/'ISCO08_Career_Interest_Crosswalk.csv'
          current_csv = root/'03 Data Integration'/'ISCO08_Current_Function_Crosswalk.csv'
          lookup_csv = root/'02 Secondary Data'/'ILO_Exposure_Lookup_Used.csv'
          ready_csv = root/'03 Data Integration'/'Strategic_Organization_Analysis_Ready.csv'

          primary = pd.read_csv(primary_csv)
          career = pd.read_csv(career_csv)
          current = pd.read_csv(current_csv)
          lookup = pd.read_csv(lookup_csv)
          ready = pd.read_csv(ready_csv)

          assert primary.shape == (200, 49), primary.shape
          assert ready.shape[0] == 200, ready.shape

          # Recreate raw workbook from the exact exported cell values.
          raw_xlsx = root/'01 Primary Data'/'Compiled Participants Data_v2.xlsx'
          with pd.ExcelWriter(raw_xlsx, engine='openpyxl') as w:
              primary.to_excel(w, index=False, sheet_name='Sheet1')

          # Analysis-ready workbook.
          ready_xlsx = root/'03 Data Integration'/'Strategic_Organization_Analysis_Ready.xlsx'
          with pd.ExcelWriter(ready_xlsx, engine='openpyxl') as w:
              ready.to_excel(w, index=False, sheet_name='Analysis Ready')

          # Integrated participant-level dataset.
          c1 = career.rename(columns={
              'ISCO-08':'Career Interest ISCO-08',
              'ISCO Title':'Career Interest ISCO Title',
              'Mapping Confidence':'Career Interest Mapping Confidence',
              'ILO GenAI Exposure Category':'Career Interest ILO Exposure Category',
              'Exposure Ordinal (Analytical Recode)':'Career Interest Exposure Ordinal'
          })
          c1_keep = ['Career Interest','Career Interest ISCO-08','Career Interest ISCO Title',
                     'Career Interest Mapping Confidence','Career Interest ILO Exposure Category',
                     'Career Interest Exposure Ordinal']
          c2 = current.rename(columns={
              'ISCO-08':'Current Function ISCO-08',
              'ISCO Title':'Current Function ISCO Title',
              'Mapping Confidence':'Current Function Mapping Confidence',
              'ILO GenAI Exposure Category':'Current Function ILO Exposure Category',
              'Exposure Ordinal (Analytical Recode)':'Current Function Exposure Ordinal'
          })
          c2_keep = ['Current Job Function','Current Function ISCO-08','Current Function ISCO Title',
                     'Current Function Mapping Confidence','Current Function ILO Exposure Category',
                     'Current Function Exposure Ordinal']

          integrated = primary.merge(c2[c2_keep], on='Current Job Function', how='left')
          integrated = integrated.merge(c1[c1_keep], on='Career Interest', how='left')

          conventional_cols = ['Strategic Thinking Pre','Problem Solving Pre','Decision Making Pre',
                               'Leadership Pre','Adaptability Pre','Digital Capability Pre']
          ai_cols = ['AI Knowledge Pre','AI Application Pre','AI Judgement Pre','Data Literacy Pre']
          integrated['Conventional Capability Index'] = integrated[conventional_cols].mean(axis=1).round(4)
          integrated['AI/Data Capability Index'] = integrated[ai_cols].mean(axis=1).round(4)
          integrated['Capability Gap'] = (integrated['Conventional Capability Index'] - integrated['AI/Data Capability Index']).round(4)
          integrated['Career Exposure Analysis Eligible'] = integrated['Career Interest ILO Exposure Category'].notna().map({True:'Yes', False:'No'})
          integrated['Mapping Version'] = 'v1.0 | ILO Gmyrek et al. 2025'

          # Put linkage fields immediately after original variables.
          desired = list(primary.columns) + [
              'Current Function ISCO-08','Current Function ISCO Title','Current Function Mapping Confidence',
              'Current Function ILO Exposure Category','Current Function Exposure Ordinal',
              'Career Interest ISCO-08','Career Interest ISCO Title','Career Interest Mapping Confidence',
              'Career Interest ILO Exposure Category','Career Interest Exposure Ordinal',
              'Conventional Capability Index','AI/Data Capability Index','Capability Gap',
              'Career Exposure Analysis Eligible','Mapping Version'
          ]
          integrated = integrated[desired]
          assert integrated.shape == (200, 64), integrated.shape

          method = pd.DataFrame([
              ['Primary occupational linkage','Career Interest mapped to ISCO-08 unit groups','Career Interest is granular for 198/200 participants; Current Job Function is often broad','Yes','https://esco.ec.europa.eu/en/classification/occupation_main','Re-run excluding Medium/Low-confidence mappings'],
              ['Current Job Function linkage','Only specific occupation labels are coded; broad categories are left unmapped','Avoids false precision and forced occupational classification','No','https://esco.ec.europa.eu/en/classification/occupation_main','Use only as exploratory/robustness evidence'],
              ['GenAI exposure variable','Official ILO 2025 occupational exposure category at ISCO-08 unit-group level','Directly aligned to occupational GenAI exposure','Yes','https://github.com/pgmyrek/2025_GenAI_scores_ISCO08','Use category dummies and ordered specification'],
              ['Exposure ordinal','Not Exposed=0; Minimal=1; Gradient 1=2; Gradient 2=3; Gradient 3=4; Gradient 4=5','Project-created ordered recode for analysis','Secondary','ILO source data','Do not describe as an ILO continuous score'],
              ['Conventional capability index','Mean of six conventional baseline dimensions','Captures conventional strategic/managerial capability','Yes','Primary participant data','Test individual dimensions separately'],
              ['AI/data capability index','Mean of AI Knowledge, AI Application, AI Judgement and Data Literacy','Captures AI/data capability','Yes','Primary participant data','Test individual dimensions separately'],
              ['Capability gap','Conventional capability minus AI/data capability','Operationalises within-person strategic/AI capability asymmetry','Yes','Derived in workbook','Check standardised and latent-score formulations'],
              ['Post-assessment data','Not used as the main outcome','Only 12/200 participants have Overall Post Score and intervention fields are largely empty','No','Primary participant data','Report separately only if justified']
          ], columns=['Item','Method / Decision','Reason','Primary Variable?','Source / Reference URL','Sensitivity Treatment'])

          mapped = integrated['Career Interest ILO Exposure Category'].notna().sum()
          high = (integrated['Career Interest Mapping Confidence'] == 'High').sum()
          medium = (integrated['Career Interest Mapping Confidence'] == 'Medium').sum()
          low = (integrated['Career Interest Mapping Confidence'] == 'Low').sum()
          conv_mean = integrated['Conventional Capability Index'].mean()
          ai_mean = integrated['AI/Data Capability Index'].mean()
          gap_mean = integrated['Capability Gap'].mean()
          g34 = integrated['Career Interest ILO Exposure Category'].isin(['Gradient 3','Gradient 4']).sum()
          validation = pd.DataFrame([
              ['Participant rows',len(integrated),'Expected 200','PASS'],
              ['Original variables',len(primary.columns),'Expected 49','PASS'],
              ['Integrated variables',len(integrated.columns),'Expected 64','PASS'],
              ['Career-interest records with ILO linkage',mapped,'Non-missing occupational exposure linkages','PASS' if mapped == 198 else 'CHECK'],
              ['High-confidence career mappings',high,'Primary high-confidence mappings','PASS'],
              ['Medium-confidence career mappings',medium,'Retain with sensitivity exclusion','PASS'],
              ['Low-confidence career mappings',low,'Flag for sensitivity exclusion','PASS'],
              ['Mean conventional capability',round(conv_mean,2),'Six-dimension index','INFO'],
              ['Mean AI/data capability',round(ai_mean,2),'Four-dimension index','INFO'],
              ['Mean capability gap',round(gap_mean,2),'Conventional minus AI/data','INFO'],
              ['Career interests in Gradient 3 or 4',g34,'Highly exposed target occupations','INFO']
          ], columns=['Validation Metric','Result','Interpretation','Status'])

          integrated_xlsx = root/'03 Data Integration'/'Strategic_Organization_Integrated_Dataset.xlsx'
          with pd.ExcelWriter(integrated_xlsx, engine='openpyxl') as w:
              primary.to_excel(w, index=False, sheet_name='Original Data')
              integrated.to_excel(w, index=False, sheet_name='Integrated Data')
              career.to_excel(w, index=False, sheet_name='Career Interest Crosswalk')
              current.to_excel(w, index=False, sheet_name='Current Function Crosswalk')
              lookup.to_excel(w, index=False, sheet_name='ILO Exposure Lookup')
              method.to_excel(w, index=False, sheet_name='Integration Method', startrow=2)
              validation.to_excel(w, index=False, sheet_name='Validation', startrow=2)
              w.book['Integration Method']['A1'] = 'Strategic Organization | Integration Method'
              w.book['Validation']['A1'] = 'Strategic Organization | Data Integration Validation'

          def format_book(path):
              wb = load_workbook(path)
              for ws in wb.worksheets:
                  ws.sheet_view.showGridLines = False
                  ws.freeze_panes = 'A2' if ws.title not in ('Integration Method','Validation') else 'A4'
                  header_row = 1 if ws.title not in ('Integration Method','Validation') else 3
                  for cell in ws[header_row]:
                      cell.font = Font(bold=True)
                      cell.alignment = Alignment(vertical='top', wrap_text=True)
                  for col in range(1, min(ws.max_column, 20)+1):
                      letter = get_column_letter(col)
                      width = 12
                      for row in range(1, min(ws.max_row, 80)+1):
                          v = ws.cell(row, col).value
                          if v is not None:
                              width = max(width, min(35, len(str(v))+2))
                      ws.column_dimensions[letter].width = width
              wb.save(path)

          for p in (raw_xlsx, ready_xlsx, integrated_xlsx):
              format_book(p)

          # Structural validation after writing.
          wb = load_workbook(raw_xlsx, read_only=True)
          ws = wb['Sheet1']
          assert (ws.max_row, ws.max_column) == (201, 49)
          wb.close()
          wb = load_workbook(integrated_xlsx, read_only=True)
          assert wb['Original Data'].max_row == 201
          assert wb['Integrated Data'].max_column == 64
          wb.close()
          print('Excel workbooks built and validated.')
          PY

      - name: Fetch open-access Strategic Organization exemplar
        shell: bash
        run: |
          set -euo pipefail
          OUT='Strategic Organization/05 Manuscript/Exemplar Paper/Figge_Anderson_Lewis_2026_AI-Human_Learning_Systems.pdf'
          mkdir -p "$(dirname "$OUT")"
          if curl -L --fail --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Accept: application/pdf,*/*;q=0.8' \
            -H 'Referer: https://journals.sagepub.com/doi/10.1177/14761270251385860' \
            'https://journals.sagepub.com/doi/pdf/10.1177/14761270251385860' -o "$OUT"; then
              python - <<'PY'
          from pathlib import Path
          p = Path('Strategic Organization/05 Manuscript/Exemplar Paper/Figge_Anderson_Lewis_2026_AI-Human_Learning_Systems.pdf')
          b = p.read_bytes()
          if not b.startswith(b'%PDF') or len(b) < 100000:
              raise SystemExit('Publisher response was not a valid full PDF')
          print(f'Exemplar PDF validated: {len(b):,} bytes')
          PY
          else
              rm -f "$OUT"
              echo 'Publisher blocked automated PDF retrieval; official article URL remains in exemplar README.'
          fi

      - name: Commit final verified project and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Strategic Organization'
          git rm -rf '.transfer' || true
          git rm -f '.github/workflows/install-strategic-org-assets.yml' || true
          git commit -m 'Complete Strategic Organization research project migration'
          git push
