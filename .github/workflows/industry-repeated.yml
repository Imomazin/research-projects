name: Industry paired exploratory benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Run Paired Benchmarks.py"
      - "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Test Benchmark Design.py"
      - "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Industrial Federated Benchmark.py"
      - ".github/workflows/industry-repeated.yml"

permissions:
  contents: read

jobs:
  repeated-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dataset: [maintenance, steel]
    env:
      BASE: Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Requirements.txt"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$BASE/Requirements.txt"
      - name: Verify committed data and design invariants
        run: python "$BASE/Test Benchmark Design.py" -v
      - name: Run three paired exploratory seeds
        run: |
          python "$BASE/Run Paired Benchmarks.py" \
            --datasets "$DATASET" \
            --seeds 11 23 37 \
            --alphas 0.5 \
            --noises 1.2 \
            --rounds 2 \
            --clients 2 \
            --max-rows 800 \
            --output-dir "$BASE/Results/Repeated Benchmarks"
      - name: Preserve complete findings and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paired Research ${{ matrix.dataset }}
          path: "Industry and Intelligent Systems/Industries/Privacy Trust and Intelligent Systems in Industry Six/Experiments/Results/Repeated Benchmarks/**"
          if-no-files-found: warn
