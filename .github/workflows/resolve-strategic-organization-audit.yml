name: Resolve Strategic Organization supplementary audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-strategic-organization-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-supplementary-checks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore C supplementary checks script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'Strategic Organization/04 Analysis/Supplementary Checks'
          cat > /tmp/supplementary-checks.py.gz.b64 <<'B64'
          
          
          
          
          
          B64
          tr -d '[:space:]' < /tmp/supplementary-checks.py.gz.b64 | base64 -d | gzip -d > 'Strategic Organization/04 Analysis/Supplementary Checks/supplementary-checks.py'
          chmod 755 'Strategic Organization/04 Analysis/Supplementary Checks/supplementary-checks.py'

      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 statsmodels==0.14.6

      - name: Run S1-S11 against repository study data
        run: python 'Strategic Organization/04 Analysis/Supplementary Checks/supplementary-checks.py'

      - name: Commit exact script and reproducible outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Strategic Organization/04 Analysis/Supplementary Checks'
          git rm '.github/workflows/resolve-strategic-organization-audit.yml'
          git commit -m 'Run Strategic Organization supplementary checks and add reproducible outputs'
          git push
