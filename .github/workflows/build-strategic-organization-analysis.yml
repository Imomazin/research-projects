name: Build Strategic Organization statistical analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-strategic-organization-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-analysis:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: |
          python -m pip install --quiet numpy==2.3.5 scipy==1.17.0 statsmodels==0.14.6 matplotlib==3.10.8

      - name: Reconstruct reproducible analysis pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'Strategic Organization/04 Analysis/Reproducible Analysis'
          base64 -d '.transfer/analysis_pipeline.py.gz.b64' | gunzip > 'Strategic Organization/04 Analysis/Reproducible Analysis/analysis_pipeline.py'
          test -s 'Strategic Organization/04 Analysis/Reproducible Analysis/analysis_pipeline.py'
          grep -q 'Statistical Modeling Report' 'Strategic Organization/04 Analysis/Reproducible Analysis/analysis_pipeline.py'

      - name: Run complete statistical modelling
        env:
          SO_PROJECT_ROOT: ${{ github.workspace }}/Strategic Organization
        run: |
          python 'Strategic Organization/04 Analysis/Reproducible Analysis/analysis_pipeline.py'

      - name: Validate model outputs
        shell: bash
        run: |
          set -euo pipefail
          OUT='Strategic Organization/04 Analysis/Statistical Modeling'
          test -s "$OUT/STATISTICAL_MODELING_REPORT.md"
          test -s "$OUT/MODEL_SPECIFICATION_AND_CLAIM_DISCIPLINE.md"
          test -s "$OUT/table_11_core_regressions.csv"
          test -s "$OUT/table_12_robustness.csv"
          test -s "$OUT/figure_01_capability_asymmetry.png"
          test -s "$OUT/figure_04_capability_sorting.png"
          python - <<'PY'
          import csv, json, pathlib
          out=pathlib.Path('Strategic Organization/04 Analysis/Statistical Modeling')
          manifest=json.loads((out/'analysis_manifest.json').read_text())
          assert manifest['mapped_n']==198, manifest
          assert manifest['unique_isco_clusters']==19, manifest
          assert manifest['high_exposure_n']==125, manifest
          assert abs(manifest['mean_capability_gap']-16.6303)<0.01, manifest
          with open(out/'table_11_core_regressions.csv', newline='', encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert any(r['Model']=='M2 AI absolute ~ high exposure + conventional' for r in rows)
          for p in out.glob('figure_*.png'):
              assert p.stat().st_size > 50000, (p, p.stat().st_size)
          print('Statistical output validation passed')
          PY

      - name: Commit final modelling package and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Strategic Organization/04 Analysis/'
          git rm -rf '.transfer' || true
          git rm -f '.github/workflows/build-strategic-organization-analysis.yml'
          git commit -m 'Complete Strategic Organization statistical modelling'
          git push
